[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ebs-orphan-finder"
version = "1.0.0"
description = "Find unattached EBS volumes older than N days across an AWS Organization, report their cost and plan a safe cleanup."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "John Vega" }]
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = [
  "moto[ec2,organizations,sts]>=5.0",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[ec2,organizations,sts]>=1.35",
]

[project.scripts]
ebs-orphans = "ebs_orphans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebs_orphans = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=ebs_orphans --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
